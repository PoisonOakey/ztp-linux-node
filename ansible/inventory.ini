# Static inventory for the lab node.
#
# There is no host discovery here and that is deliberate. The node is reached
# through a VirtualBox NAT port-forward configured in scripts/02-provision-node.ps1
# (host 2222 -> guest 22), so its address is a constant rather than something to
# look up at runtime. See docs/TROUBLESHOOTING.md #6 for why IP discovery was
# removed rather than repaired.
#
# The private key is the control-node copy created during setup -- Windows files
# under /mnt/c report mode 0777 and OpenSSH refuses them. See docs/ANSIBLE-SETUP.md.

[node]
sre-node-01 ansible_host=127.0.0.1 ansible_port=2222

[node:vars]
ansible_user=sysadmin
ansible_ssh_private_key_file=~/.ssh/id_ed25519
; Pinned rather than discovered. Without this Ansible warns that a future
; interpreter install could change which python it picks.
ansible_python_interpreter=/usr/bin/python3
