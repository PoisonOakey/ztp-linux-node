# Every setting here is verified as taking effect via:
#   ansible-config dump --type all --only-changed
# Defaults are left alone rather than restated -- a config file that repeats
# defaults hides the settings that actually matter.

[defaults]
inventory = inventory.ini

# The VM's SSH host key changes on every rebuild, and the node always answers on
# the same forwarded address, so strict checking would fail after each
# re-provision. scripts/02-provision-node.ps1 clears the stale known_hosts entry
# for the same reason. Acceptable for a local lab reached over loopback; it would
# not be acceptable against a real host.
host_key_checking = False

[ssh_connection]
# Run each module in a single SSH round trip instead of writing a temp file
# first. Off by default. Safe here because the node has no `requiretty` in its
# sudoers, which is the usual reason this cannot be enabled.
pipelining = True
