---
# Top-level play for the lab node.
#
# Roles are added here as they are written. Until then this is a smoke test:
# it proves the control node can connect, authenticate, gather facts and
# template output -- every dependency a real role has.
#
# Neither task below can report "changed", so a second run must be identical to
# the first. That is the property every role added here has to preserve.

- name: Configure the SRE node
  hosts: node
  gather_facts: true

  tasks:
    - name: Confirm the control node can reach the target
      ansible.builtin.ping:

    - name: Report what we connected to
      ansible.builtin.debug:
        msg: >-
          Connected to {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}
          ({{ ansible_facts['kernel'] }})
          as {{ ansible_user }} --
          {{ ansible_facts['processor_vcpus'] }} vCPU,
          {{ (ansible_facts['memtotal_mb'] / 1024) | round(1) }} GB RAM
