name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning -ExcludeRule PSUseBOMForUnicodeEncodedFile
          if ($results) {
            $results | Format-Table
            Write-Error "PSScriptAnalyzer found issues."
            exit 1
          } else {
            Write-Output "No issues found! Scripts are clean."
          }

      - name: Validate config/node.json
        shell: powershell
        run: |
          $config = Get-Content config/node.json -Raw | ConvertFrom-Json
          $required = @('vm_name','lab_dir','iso_url','ram_mb','cpu_cores','disk_size_mb')
          foreach ($key in $required) {
            if (-not $config.PSObject.Properties.Name.Contains($key)) {
              Write-Error "config/node.json is missing required key: $key"
              exit 1
            }
          }
          Write-Output "config/node.json is valid."

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          cp monitoring/.env.example monitoring/.env
          docker compose -f monitoring/docker-compose.yml config

  # Static validation of the Ansible layer. This proves the playbook parses and
  # follows conventions -- it does NOT prove it converges against a real node.
  # Nothing here connects to anything. Convergence is verified by running
  # site.yml twice against the VM and confirming the second run reports
  # changed=0; see docs/ROADMAP.md.
  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ansible-core and ansible-lint
        run: pip install --disable-pip-version-check ansible-core ansible-lint

      - name: Install collection dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax check the playbook
        run: ansible-playbook site.yml --syntax-check

      - name: Lint roles and playbook
        run: ansible-lint

  # The configuration files the other three jobs never open: the Prometheus
  # scrape config and alert rules, the Alertmanager config, the cloud-init
  # autoinstall file, and the Grafana dashboard.
  #
  # These are grouped because they share a failure mode. None of them crashes
  # anything when it is wrong -- a malformed alert rule is simply a rule that
  # never fires, and an unresolvable datasource uid is a dashboard that renders
  # empty panels. Nothing surfaces until the incident the rule existed to catch.
  #
  # promtool and amtool come from the same images the stack runs, so the
  # validators are the versions that will actually read these files.
  config-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Follows rule_files, so it validates alert_rules.yml through the same
      # path Prometheus does at startup. The image tag matches the one pinned in
      # docker-compose.yml, so this is the promtool that ships with the
      # Prometheus these files are actually loaded by.
      - name: Check the Prometheus scrape config
        run: |
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.13.2 \
            check config /etc/prometheus/prometheus.yml

      # Also checked directly, so the rules stay validated if they are ever
      # detached from prometheus.yml.
      - name: Check the alert rules
        run: |
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.13.2 \
            check rules /etc/prometheus/alert_rules.yml

      # The committed example, which documents the shape without the credential.
      - name: Check the Alertmanager example config
        run: |
          docker run --rm -v "$PWD/monitoring/alertmanager:/cfg:ro" \
            --entrypoint amtool prom/alertmanager:v0.33.1 \
            check-config /cfg/alertmanager.yml.example

      - name: Install ansible-core
        run: pip install --disable-pip-version-check ansible-core

      # The file the node actually runs is rendered from alertmanager.yml.j2, and
      # checking only the example leaves the template free to drift away from it.
      # Both branches are rendered: with a webhook, the config routes to Discord;
      # without one it routes to the 'null' receiver, which is what a fresh clone
      # gets. A template valid in one branch and broken in the other would
      # otherwise be found by a crash-looping container on the node.
      - name: Render and check both branches of the Alertmanager template
        run: |
          mkdir -p .ci-rendered
          # Written into the workspace rather than /tmp: template `src` is
          # resolved relative to the playbook's own directory, so a playbook in
          # /tmp cannot see the repository.
          cat > .ci-render.yml <<'YML'
          - hosts: localhost
            connection: local
            gather_facts: false
            tasks:
              - name: Render with a webhook configured
                ansible.builtin.template:
                  src: ansible/roles/monitoring/templates/alertmanager.yml.j2
                  dest: "{{ playbook_dir }}/.ci-rendered/with-webhook.yml"
                  mode: "0644"
                vars:
                  monitoring_discord_webhook: https://discord.com/api/webhooks/0/ci-render-check

              - name: Render with no webhook configured
                ansible.builtin.template:
                  src: ansible/roles/monitoring/templates/alertmanager.yml.j2
                  dest: "{{ playbook_dir }}/.ci-rendered/no-webhook.yml"
                  mode: "0644"
                vars:
                  monitoring_discord_webhook: ""
          YML
          ansible-playbook .ci-render.yml
          for branch in with-webhook no-webhook; do
            echo "--- $branch ---"
            docker run --rm -v "$PWD/.ci-rendered:/cfg:ro" \
              --entrypoint amtool prom/alertmanager:v0.33.1 \
              check-config "/cfg/$branch.yml"
          done

      - name: Install PyYAML
        run: pip install --disable-pip-version-check pyyaml

      - name: Check cloud-init, the dashboard, and the runbook links
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import sys

          import yaml

          failures = []

          # The autoinstall file. A break here is not caught until minutes into an
          # unattended install, so parse it and assert the keys Subiquity needs.
          user_data = yaml.safe_load(pathlib.Path("scripts/cloud-init/user-data").read_text())
          autoinstall = (user_data or {}).get("autoinstall")
          if not isinstance(autoinstall, dict):
              failures.append("user-data: no autoinstall section")
          else:
              for key in ("version", "identity", "ssh", "storage"):
                  if key not in autoinstall:
                      failures.append(f"user-data: missing autoinstall.{key}")

          # The dashboard, and the datasource uid it is coupled to. The uid is
          # fixed in the provisioning file precisely because the dashboard JSON
          # hardcodes it; nothing but this check keeps the two in step.
          dashboard_path = pathlib.Path("monitoring/grafana/dashboards/node-overview.json")
          dashboard = dashboard_path.read_text()
          try:
              json.loads(dashboard)
          except json.JSONDecodeError as exc:
              failures.append(f"node-overview.json: {exc}")

          datasource = yaml.safe_load(
              pathlib.Path("monitoring/grafana/provisioning/datasources/prometheus.yml").read_text()
          )
          uid = datasource["datasources"][0]["uid"]
          if f'"uid": "{uid}"' not in dashboard:
              failures.append(
                  f"datasource uid '{uid}' is not referenced by node-overview.json -- "
                  "its panels will not resolve a datasource"
              )

          # Every alert needs a runbook section, and its runbook_url has to anchor
          # to that section. Both sides are hand-maintained, in different files.
          rules = yaml.safe_load(pathlib.Path("monitoring/alert_rules.yml").read_text())
          runbook = pathlib.Path("docs/RUNBOOK.md").read_text()
          headings = set(re.findall(r"^## (.+)$", runbook, re.M))
          alerts = [rule for group in rules["groups"] for rule in group["rules"]]

          for rule in alerts:
              name = rule["alert"]
              if name not in headings:
                  failures.append(f"{name}: no '## {name}' section in docs/RUNBOOK.md")
              url = rule.get("annotations", {}).get("runbook_url", "")
              if not url.endswith(f"#{name.lower()}"):
                  failures.append(f"{name}: runbook_url does not anchor to #{name.lower()}")

          if failures:
              print("\n".join(f"FAIL: {failure}" for failure in failures))
              sys.exit(1)

          print(
              f"OK: user-data, dashboard, datasource uid '{uid}', "
              f"{len(alerts)} alerts linked to the runbook"
          )
          PY
