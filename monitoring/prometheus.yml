global:
  scrape_interval: 15s
  # How often alerting rules are re-evaluated. Matches the scrape interval so a
  # rule never fires on data it has already seen.
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

# Where firing alerts are sent. Prometheus evaluates the rules; Alertmanager
# decides who hears about them, groups related alerts, and holds silences.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']
